name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Public privacy gate
        run: python scripts/check_public_privacy.py
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev,ml,data,xgb]"
      - name: Test
        run: python -m pytest -q

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python and native build dependencies
        run: pip install -e ".[dev,ml,data,xgb,native]"
      - name: Build C++20 extension
        run: |
          cmake -S cpp -B build/native -DPython_EXECUTABLE="$(which python)" -DCMAKE_BUILD_TYPE=Release -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/src/cloblab"
          cmake --build build/native -j 2
      - name: Require native backend and run tests
        run: |
          python -c 'from cloblab.native import backend_module; assert backend_module("native") is not None'
          python -m pytest -q
      - name: Public privacy gate
        run: python scripts/check_public_privacy.py
