[project]
name = "market-microstructure-lab"
version = "0.2.0"
description = "Market microstructure research engine: deterministic L2 replay, causal signal evaluation, execution diagnostics, and C++20 queue/replay kernels."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "pyarrow>=15.0",
  "duckdb>=0.10",
  "websockets>=12.0",
  "sortedcontainers>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
native = ["pybind11>=2.13,<4", "cmake>=3.20"]
ml = ["scikit-learn>=1.4", "matplotlib>=3.8"]
data = ["h5py>=3.10"]
xgb = ["xgboost>=3.0,<3.1"]

[project.scripts]
cloblab = "cloblab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
