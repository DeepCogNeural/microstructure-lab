[project]
name = "crypto-microstructure-lab"
version = "0.1.0"
description = "Crypto market microstructure lab for public L2 reconstruction, markouts, and cost proxies."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "pyarrow>=15.0",
  "duckdb>=0.10",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cloblab = "cloblab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

